<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Clockodo Auto-Fill</title>
  <style>
    body {
      width: 300px;
      font: 13px/1.4 -apple-system, Segoe UI, Arial, sans-serif;
      margin: 0;
      padding: 12px;
      color: #1b1b1b;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #bbb;
      display: inline-block;
      flex: none;
    }
    .dot.ok { background: #2ecc71; }
    .dot.bad { background: #e74c3c; }
    .row { margin-bottom: 10px; }
    label { display: block; font-size: 12px; color: #555; margin-bottom: 3px; }
    input[type="date"], input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 4px 6px;
      font-size: 12px;
    }
    .two-col { display: flex; gap: 6px; }
    .two-col > div { flex: 1; }
    button {
      width: 100%;
      padding: 7px;
      margin-bottom: 6px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid #ccc;
      background: #f5f5f5;
      border-radius: 4px;
    }
    button.primary { background: #2d6cdf; color: #fff; border-color: #2d6cdf; }
    button.primary:hover { background: #255bbd; }
    button:hover { background: #eaeaea; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 12px; }
    #status {
      font-size: 11px;
      color: #444;
      white-space: pre-wrap;
      max-height: 120px;
      overflow-y: auto;
      background: #f8f8f8;
      border-radius: 4px;
      padding: 6px;
      margin-top: 4px;
    }
    hr { border: none; border-top: 1px solid #eee; margin: 10px 0; }
    a { font-size: 12px; }
  </style>
</head>
<body>
  <h1><span class="dot" id="connDot"></span><span id="connLabel">Checking connection…</span></h1>

  <button class="primary" id="fillTodayBtn">Fill today</button>

  <div class="row two-col">
    <div>
      <label for="fromDate">From</label>
      <input type="date" id="fromDate" />
    </div>
    <div>
      <label for="toDate">To</label>
      <input type="date" id="toDate" />
    </div>
  </div>
  <button id="fillRangeBtn">Fill range</button>

  <hr />

  <div class="toggle-row">
    <span>Auto-fill daily</span>
    <input type="checkbox" id="autoDailyToggle" />
  </div>
  <div class="toggle-row">
    <span>Skip today</span>
    <input type="checkbox" id="skipTodayToggle" />
  </div>

  <div id="status"></div>

  <hr />
  <a href="#" id="optionsLink">Options…</a>

  <script src="popup.js" type="module"></script>
</body>
</html>
