<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Clockodo Auto-Fill</title>
  <link rel="stylesheet" href="../styles/theme.css" />
  <style>
    body { width: 320px; padding: 14px; }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .header img { width: 30px; height: 30px; border-radius: 8px; }
    .header .title { font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
    .header .sub { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-muted); }
    .card { padding: 12px; margin-bottom: 10px; }
    button.primary.block { font-size: 14px; padding: 11px 12px; }
    .range-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .range-row > div { flex: 1; min-width: 0; }
    .range-row .field-label { font-size: 11px; margin-bottom: 3px; }
    .switch-row { padding: 8px 0; }
    .quick-ranges { display: flex; gap: 6px; margin-bottom: 8px; }
    .quick-ranges button { flex: 1; width: auto; padding: 5px 6px; font-size: 11.5px; }
    .existing-row { margin-top: 10px; }
    .existing-row .field-label { font-size: 11px; margin-bottom: 3px; }
    .existing-row select { font-size: 12px; padding: 6px 8px; }
    .existing-row select.danger { border-color: var(--danger); }
    #status {
      font-size: 11.5px;
      white-space: pre-wrap;
      max-height: 110px;
      overflow-y: auto;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      margin-top: 8px;
      display: none;
    }
    #status.show { display: block; }
    .footer {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11.5px; color: var(--text-muted); padding: 0 2px;
    }
    .footer .links { display: flex; gap: 10px; align-self: flex-start; }
    .footer .meta { display: flex; flex-direction: column; gap: 1px; line-height: 1.35; }
    .footer .meta .ok { color: var(--ok); }
    .footer .meta .warn { color: var(--warn); }
    .update-banner {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin-bottom: 10px; padding: 9px 12px; border-radius: 10px;
      background: var(--accent-soft); color: var(--text); font-size: 12px; text-decoration: none;
    }
    .update-banner:hover { text-decoration: none; filter: brightness(1.03); }
    .update-banner[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <img src="../../assets/icons/icon48.png" alt="" />
    <div>
      <div class="title">Clockodo Auto-Fill</div>
      <div class="sub"><span class="dot" id="connDot"></span><span id="connLabel">Checking connection…</span></div>
    </div>
  </div>

  <a id="updateBanner" class="update-banner" hidden target="_blank" rel="noopener noreferrer">
    <span id="updateText"></span><span class="badge">Download</span>
  </a>

  <div class="card">
    <button class="primary block" id="fillTodayBtn">Fill today</button>
    <div id="status" class="status-text"></div>
  </div>

  <div class="card">
    <div class="range-row">
      <div>
        <label class="field-label" for="fromDate">From</label>
        <input type="date" id="fromDate" />
      </div>
      <div>
        <label class="field-label" for="toDate">To</label>
        <input type="date" id="toDate" />
      </div>
    </div>
    <div class="quick-ranges">
      <button type="button" class="small" data-range="thisWeek">This week</button>
      <button type="button" class="small" data-range="lastWeek">Last week</button>
      <button type="button" class="small" data-range="thisMonth">This month</button>
    </div>
    <button class="block secondary" id="fillRangeBtn">Fill range</button>
    <div class="existing-row">
      <label class="field-label" for="onExisting">If a day already has any time entry</label>
      <select id="onExisting">
        <option value="skip">Skip that day (default)</option>
        <option value="replace">Replace — delete all of that day's entries, book my blocks</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="switch-row">
      <div>
        <div class="lbl">Auto-fill daily</div>
        <div class="sub" id="nextRun">Off</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="autoDailyToggle" />
        <span class="track"></span>
      </label>
    </div>
    <div class="switch-row">
      <div class="lbl">Skip today</div>
      <label class="switch">
        <input type="checkbox" id="skipTodayToggle" />
        <span class="track"></span>
      </label>
    </div>
  </div>

  <div class="footer">
    <span class="meta">
      <span id="versionInfo"></span>
    </span>
    <span class="links">
      <a href="#" id="activityLink">Activity</a>
      <a href="../help/help.html" target="_blank" rel="noopener noreferrer">Help</a>
      <a href="#" id="optionsLink">Options</a>
    </span>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
